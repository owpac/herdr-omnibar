[package]
name = "herdr-omnibar"
# The version of the last release (YYYY.M.N). 0.0.0 until the first release.
version = "2026.11.4"
edition = "2021"
# The oldest toolchain that the cargo fallback of scripts/install.sh supports.
rust-version = "1.89"
description = "One bar to go to an agent, a tab or a workspace of herdr, and to create a tab or a worktree"
license = "MIT"
publish = false

# The stack: ratatui and its crossterm backend for the popup, serde_json for the JSON of herdr,
# toml for config.toml, unicode-width for the columns. No other dependency without a reason.
[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
